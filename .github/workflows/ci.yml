name: Project CI

on:
  push:
    branches:
      - feature/dev6-devops-qa
      - Integration/Testing
  pull_request:
    branches:
      - feature/dev6-devops-qa
      - Integration/Testing
  workflow_dispatch:

jobs:
  python-tests:
    name: D3 Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check D3 files
        id: check_d3
        run: |
          if [ -d scraper_detection ] && [ -d tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check_d3.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'

      - name: Install dependencies
        if: steps.check_d3.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 pytest

      - name: Run D3 tests
        if: steps.check_d3.outputs.available == 'true'
        run: python -m pytest -q

      - name: Report pending integration
        if: steps.check_d3.outputs.available == 'false'
        run: echo "D3 tests skipped because source files are not integrated yet."

  frontend-build:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend files
        id: check_frontend
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check_frontend.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.check_frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        if: steps.check_frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        if: steps.check_frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm run build

      - name: Report pending integration
        if: steps.check_frontend.outputs.available == 'false'
        run: echo "Frontend checks skipped because source files are not integrated yet."